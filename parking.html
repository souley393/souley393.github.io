<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parking Reminder</title>
<meta name="theme-color" content="#2B2D31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parking">
<style>
  :root{
    --concrete:#2B2D31; --concrete-lt:#3A3D43; --line:#4A4E56;
    --safety:#FFC93C; --text:#EDEDEA; --text-dim:#9BA0A8;
    --danger:#FF6B57; --ok:#7ED491;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; background:var(--concrete); color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    display:flex; justify-content:center;
    padding-top:env(safe-area-inset-top);
  }
  .wrap{width:100%; max-width:440px; padding:24px 20px 48px;}

  .header{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .logo{width:34px; height:34px; background:var(--safety); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:#1A1B1E; font-weight:900; font-size:20px;}
  .title{font-weight:900; font-size:17px;}
  .subtitle{font-size:12px; color:var(--text-dim);}

  .card{background:var(--concrete-lt); border-radius:16px; padding:22px 20px;
    border:1px solid var(--line);}

  label.field{font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; margin-bottom:6px; display:block;}
  input{
    width:100%; background:var(--concrete); border:1px solid var(--line);
    border-radius:8px; color:var(--text); padding:12px 14px; font-size:16px;
    outline:none; font-family:inherit;
  }
  input:focus{border-color:var(--safety);}
  #spot-input{font-size:26px; font-weight:800; text-align:center;
    letter-spacing:.06em; color:var(--safety);}

  .row{margin-bottom:16px;}
  .gps-block{border-top:1px dashed var(--line); padding-top:18px; margin-bottom:18px;}

  button{
    border:none; border-radius:10px; padding:14px 18px; font-size:15px;
    font-weight:800; letter-spacing:.04em; cursor:pointer; width:100%;
    font-family:inherit;
  }
  .btn-primary{background:var(--safety); color:#1A1B1E;}
  .btn-primary:disabled{opacity:.4;}
  .btn-secondary{background:var(--concrete); color:var(--text);
    border:1px solid var(--line);}
  .btn-danger{background:transparent; color:var(--danger);
    border:1px solid var(--line); margin-top:16px;}

  .gps-ok{display:flex; align-items:center; gap:8px; background:var(--concrete);
    border-radius:8px; padding:10px 14px; border:1px solid var(--line); font-size:13px;}
  .gps-ok .check{color:var(--ok); font-size:18px;}
  .gps-ok .coords{color:var(--text-dim);}
  .geo-msg{font-size:13px; color:var(--danger); margin-top:10px; line-height:1.4;}
  .hint{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .center-hint{font-size:12px; color:var(--text-dim); text-align:center; margin-top:10px;}

  .manual-row{display:flex; gap:8px;}
  .manual-row input{font-size:14px;}
  .manual-row button{width:auto; padding:0 16px;}

  /* saved view */
  .spot-label{font-size:12px; letter-spacing:.2em; color:var(--text-dim);
    text-transform:uppercase; font-weight:700; text-align:center;}
  .spot-number{font-size:88px; font-weight:900; color:var(--safety);
    line-height:1.05; letter-spacing:.02em; text-align:center;
    text-shadow:0 2px 0 rgba(0,0,0,.35); word-break:break-word; padding:4px 0;}
  .spot-number.long{font-size:64px;}
  .spot-level{font-size:16px; font-weight:700; text-align:center; margin-top:4px;}
  .spot-time{font-size:13px; color:var(--text-dim); text-align:center; margin-top:8px;}
  .spot-note{margin-top:16px; background:var(--concrete); border-radius:8px;
    padding:10px 14px; font-size:14px; border-left:3px solid var(--safety);}
  .nav-wrap{margin-top:20px;}
  .nav-wrap a{text-decoration:none;}
  .coords-line{font-size:12px; color:var(--text-dim); text-align:center; margin-top:10px;}
  .no-gps{font-size:13px; color:var(--text-dim); text-align:center; padding:10px 0;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">P</div>
    <div>
      <div class="title">Parking Reminder</div>
      <div class="subtitle">Never lose your car again</div>
    </div>
  </div>

  <!-- ============ FORM VIEW ============ -->
  <div id="form-view" class="card hidden">
    <div class="row">
      <label class="field" for="spot-input">Spot number</label>
      <input id="spot-input" placeholder="B-42" maxlength="12" autocomplete="off">
    </div>
    <div class="row">
      <label class="field" for="level-input">Level / floor</label>
      <input id="level-input" placeholder="3" maxlength="10" autocomplete="off">
    </div>
    <div class="row">
      <label class="field" for="note-input">Note (optional)</label>
      <input id="note-input" placeholder="Near the blue elevator" maxlength="80" autocomplete="off">
    </div>

    <div class="gps-block">
      <label class="field">GPS location</label>
      <button id="gps-btn" class="btn-secondary">📍 Capture my location</button>
      <div id="gps-ok" class="gps-ok hidden">
        <span class="check">✓</span>
        <div>
          <div style="font-weight:700">Location captured</div>
          <div class="coords" id="gps-coords"></div>
        </div>
      </div>
      <div id="geo-msg" class="geo-msg hidden"></div>
      <div id="manual-block" class="hidden" style="margin-top:12px">
        <label class="field" for="manual-input">Paste coordinates instead</label>
        <div class="manual-row">
          <input id="manual-input" placeholder="35.0527, -78.8784" autocomplete="off">
          <button id="manual-btn" class="btn-secondary">Set</button>
        </div>
        <div class="hint">Tip: in Google Maps, long-press your location and copy the numbers shown.</div>
      </div>
    </div>

    <button id="save-btn" class="btn-primary" disabled>Save my parking spot</button>
    <div class="center-hint">Your spot stays saved until you clear it</div>
  </div>

  <!-- ============ SAVED VIEW ============ -->
  <div id="saved-view" class="hidden">
    <div class="card" style="padding:28px 22px">
      <div class="spot-label">Your spot</div>
      <div id="saved-spot" class="spot-number"></div>
      <div id="saved-level" class="spot-level hidden"></div>
      <div id="saved-time" class="spot-time"></div>
      <div id="saved-note" class="spot-note hidden"></div>
      <div class="nav-wrap">
        <a id="nav-link" target="_blank" rel="noopener" class="hidden">
          <button class="btn-primary">🧭&nbsp; Navigate to my car</button>
        </a>
        <div id="no-gps" class="no-gps hidden">No GPS location saved for this spot</div>
        <div id="saved-coords" class="coords-line hidden"></div>
      </div>
    </div>
    <button id="clear-btn" class="btn-danger">I found my car — clear spot</button>
  </div>
</div>

<script>
(function(){
  var KEY = "parking-current-spot";
  var coords = null;

  var $ = function(id){ return document.getElementById(id); };

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)); }
    catch(e){ return null; }
  }

  function parkedAgo(ts){
    var mins = Math.floor((Date.now() - ts) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    var h = Math.floor(mins / 60);
    return h + "h " + (mins % 60) + "m ago";
  }

  function render(){
    var saved = load();
    if (saved){
      $("form-view").classList.add("hidden");
      $("saved-view").classList.remove("hidden");

      var spotEl = $("saved-spot");
      spotEl.textContent = saved.spot || "—";
      spotEl.classList.toggle("long", (saved.spot || "").length > 4);

      if (saved.level){
        $("saved-level").textContent = "Level " + saved.level;
        $("saved-level").classList.remove("hidden");
      } else { $("saved-level").classList.add("hidden"); }

      $("saved-time").textContent = "Parked " + parkedAgo(saved.ts) + " · " +
        new Date(saved.ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

      if (saved.note){
        $("saved-note").textContent = saved.note;
        $("saved-note").classList.remove("hidden");
      } else { $("saved-note").classList.add("hidden"); }

      if (saved.lat != null){
        $("nav-link").href = "https://www.google.com/maps/dir/?api=1&destination=" +
          saved.lat + "," + saved.lng + "&travelmode=walking";
        $("nav-link").classList.remove("hidden");
        $("saved-coords").textContent = saved.lat.toFixed(5) + ", " + saved.lng.toFixed(5);
        $("saved-coords").classList.remove("hidden");
        $("no-gps").classList.add("hidden");
      } else {
        $("nav-link").classList.add("hidden");
        $("saved-coords").classList.add("hidden");
        $("no-gps").classList.remove("hidden");
      }
    } else {
      $("saved-view").classList.add("hidden");
      $("form-view").classList.remove("hidden");
    }
  }

  function updateSaveBtn(){
    var hasSpot = $("spot-input").value.trim().length > 0;
    $("save-btn").disabled = !hasSpot && !coords;
  }

  function showGeoError(msg){
    $("geo-msg").textContent = msg;
    $("geo-msg").classList.remove("hidden");
    $("manual-block").classList.remove("hidden");
  }

  function setCoords(lat, lng, acc){
    coords = {lat: lat, lng: lng};
    $("gps-btn").classList.add("hidden");
    $("geo-msg").classList.add("hidden");
    $("manual-block").classList.add("hidden");
    $("gps-coords").textContent = lat.toFixed(5) + ", " + lng.toFixed(5) +
      (acc ? " · ±" + Math.round(acc) + "m" : "");
    $("gps-ok").classList.remove("hidden");
    updateSaveBtn();
  }

  $("gps-btn").addEventListener("click", function(){
    if (!("geolocation" in navigator)){
      showGeoError("Location isn't available in this browser. Enter coordinates below or save without GPS.");
      return;
    }
    $("gps-btn").textContent = "Getting your location…";
    $("gps-btn").disabled = true;
    navigator.geolocation.getCurrentPosition(
      function(pos){
        setCoords(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
      },
      function(err){
        $("gps-btn").textContent = "📍 Capture my location";
        $("gps-btn").disabled = false;
        showGeoError(err.code === 1
          ? "Location access was blocked. Allow it in Settings, paste coordinates below, or save without GPS."
          : "Couldn't get a GPS fix. Try again, paste coordinates below, or save without GPS.");
      },
      {enableHighAccuracy: true, timeout: 12000, maximumAge: 0}
    );
  });

  $("manual-btn").addEventListener("click", function(){
    var m = $("manual-input").value.match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
    if (!m){
      showGeoError("Couldn't read that. Use the format: 35.0527, -78.8784");
      return;
    }
    setCoords(parseFloat(m[1]), parseFloat(m[2]), null);
  });

  $("spot-input").addEventListener("input", updateSaveBtn);

  $("save-btn").addEventListener("click", function(){
    var data = {
      spot: $("spot-input").value.trim() || "—",
      level: $("level-input").value.trim(),
      note: $("note-input").value.trim(),
      lat: coords ? coords.lat : null,
      lng: coords ? coords.lng : null,
      ts: Date.now()
    };
    localStorage.setItem(KEY, JSON.stringify(data));
    // reset form
    $("spot-input").value = ""; $("level-input").value = ""; $("note-input").value = "";
    coords = null;
    $("gps-ok").classList.add("hidden");
    $("gps-btn").classList.remove("hidden");
    $("gps-btn").textContent = "📍 Capture my location";
    $("gps-btn").disabled = false;
    updateSaveBtn();
    render();
  });

  $("clear-btn").addEventListener("click", function(){
    localStorage.removeItem(KEY);
    render();
  });

  // refresh "parked X ago" every 30s
  setInterval(function(){ if (load()) render(); }, 30000);

  render();
})();
</script>
</body>
</html>
